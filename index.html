<script>
    const scenarios = [
        { user: "Tolong berikan agenda briefing Senin untuk minggu ini.", agent: "Tentu. Minggu ini kita fokus pada industri manufaktur di Bandung Selatan. Saya sudah menyiapkan list 15 prospek klien di Google Docs dan membagikan jadwal follow-up awal ke Google Calendar Anda." },
        { user: "Siapa saja klien yang harus saya follow-up hari ini?", agent: "Hari ini Anda memiliki 3 jadwal follow-up prioritas. Detail kontak, nomor telepon, dan riwayat obrolan terakhir sudah saya masukkan ke Google Tasks harian Anda. Silakan cek." },
        { user: "Apa langkah canvassing dan digital marketing kita hari ini?", agent: "Untuk canvassing, tim akan menyisir area industri Cimahi (rute terlampir). Untuk digital marketing, hari ini kita mempublikasikan konten bertema 'Efisiensi Biaya Listrik Pabrik 30% dengan Solar Panel'. Semua jadwal sudah sinkron!" }
    ];

    function runScenario(index) {
        const chatBox = document.getElementById('chat-box');
        const typing = document.getElementById('typing-indicator');
        
        const userMsg = document.createElement('div');
        userMsg.className = 'message msg-user';
        userMsg.textContent = scenarios[index].user;
        chatBox.insertBefore(userMsg, typing);
        
        typing.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            typing.style.display = 'none';
            const agentMsg = document.createElement('div');
            agentMsg.className = 'message msg-agent';
            agentMsg.textContent = scenarios[index].agent;
            chatBox.insertBefore(agentMsg, typing);
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1500);
    }

    // KREDENSIAL SUPABASE ANDA
    const SUPABASE_URL = 'https://jhoqnooaowglnkjvgmnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2G8DfOMIzz2ZDonv68l9wQ_4j8nNlWV';

    // PERBAIKAN: Ubah nama variabel menjadi supabaseClient agar tidak bentrok
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchPlaces() {
        const listContainer = document.getElementById('places-list');
        const loadingIndicator = document.getElementById('places-loading');

        try {
            // PERBAIKAN: Gunakan supabaseClient di sini
            const { data, error } = await supabaseClient
                .from('places')
                .select('*')
                .order('id', { ascending: true })
                .limit(10); 

            if (error) throw error;

            loadingIndicator.style.display = 'none';
            listContainer.innerHTML = '';

            if (!data || data.length === 0) {
                listContainer.innerHTML = '<li style="text-align:center; color:#a3a3a3;">Belum ada data tersedia.</li>';
                return;
            }

            data.forEach(place => {
                const li = document.createElement('li');
                li.className = 'data-item';
                
                const address = [place.street, place.city].filter(Boolean).join(', ') || 'Alamat tidak tersedia';
                const rating = place.total_score ? `★ ${place.total_score} (${place.reviews_count} ulasan)` : 'Belum ada rating';
                
                li.innerHTML = `
                    <div class="data-item-title">${place.title || 'Tanpa Nama'}</div>
                    <div class="data-item-address">📍 ${address}</div>
                    <div class="data-item-score">${rating}</div>
                `;
                listContainer.appendChild(li);
            });

        } catch (error) {
            console.error('Error fetching data dari Supabase:', error.message);
            loadingIndicator.textContent = 'Gagal memuat data dari database.';
            loadingIndicator.style.color = '#ef4444';
        }
    }

    document.addEventListener('DOMContentLoaded', fetchPlaces);
</script>
